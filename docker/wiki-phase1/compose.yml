name: adah-wiki-phase1

services:
  mariadb:
    image: mariadb:10.11.14@sha256:dbe56e20372fc6d6b8e0e396866ba89c4c7f128c38c4f59aaa54d957db95790c
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD: phase1-root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.0.15-alpine@sha256:c9d92d840fd011c908f040592857c724ae6d877f2aba5c40ad963276507386b2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  frappe:
    build:
      context: ../..
      dockerfile: docker/wiki-phase1/Containerfile
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PHASE1_SITE: wiki-phase1.localhost
      PHASE1_ADMIN_PASSWORD: admin
      PHASE1_DB_ROOT_PASSWORD: phase1-root
    ports:
      - "8000:8000"
      - "9000:9000"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--header",
          "Host: wiki-phase1.localhost",
          "http://localhost:8000/api/method/ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
