name: Build Wiki v16 Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Immutable Frappe v16 + CRM + Wiki image
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out CRM source
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish immutable Wiki v16 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/wiki-phase1/Containerfile
          target: runtime
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/adah.crm:wiki-v16-${{ github.sha }}
          build-args: |
            FRAPPE_COMMIT=ba36d03916ee05391bee0cf0f979ab97d552eede
            CRM_COMMIT=${{ github.sha }}
            WIKI_COMMIT=2e4e4f215368387c08553c3c59723c7a2e1bf306
