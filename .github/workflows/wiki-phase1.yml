name: Wiki Phase 1 Compatibility

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - "crm/wiki/**"
      - "crm/hooks.py"
      - "frontend/src/components/Layouts/AppSidebar.vue"
      - "docker/wiki-phase1/**"
      - ".github/workflows/wiki-phase1.yml"
      - ".github/workflows/wiki-v16-build.yml"

permissions:
  contents: read

concurrency:
  group: wiki-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Pinned CRM + Wiki compatibility harness
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out compatibility harness
        uses: actions/checkout@v6

      - name: Report Docker runtime
        run: |
          docker version
          docker compose version

      - name: Build, install, and verify disposable site
        env:
          CRM_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash docker/wiki-phase1/run.sh

      - name: Capture container logs on failure
        if: failure()
        run: docker compose --file docker/wiki-phase1/compose.yml logs --no-color
